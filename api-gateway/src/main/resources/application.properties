spring.application.name=api-gateway

# Porta HTTP do Gateway (padrão Spring Boot — igual às aulas 5 e 6)
server.port=8080

# ─── Endereços dos microsserviços gRPC internos ───────────────────────────
# Podem ser sobrescritos por variáveis de ambiente na VM/Cloud
grpc.aluno.host=${ALUNO_HOST:localhost}
grpc.aluno.port=${ALUNO_PORT:9091}

grpc.treino.host=${TREINO_HOST:localhost}
grpc.treino.port=${TREINO_PORT:9092}

grpc.financeiro.host=${FINANCEIRO_HOST:localhost}
grpc.financeiro.port=${FINANCEIRO_PORT:9093}

# Serialização JSON: datas como String ISO-8601, nunca timestamps numéricos
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── Configuração de Segurança JWT (Aula 7) ───────────────────────────────
jwt.secret=${JWT_SECRET:segredo-didatico-com-tamanho-suficiente-para-hs256}
jwt.expiration-minutes=30

# ─── Swagger / OpenAPI ────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

