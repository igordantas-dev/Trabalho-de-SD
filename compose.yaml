name: gymflow

x-database-environment: &database-environment
  DB_URL: jdbc:postgresql://postgres:5432/academia
  DB_USER: postgres
  DB_PASSWORD: gymflow_local_123

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: academia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gymflow_local_123
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academia"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  aluno-service:
    build:
      context: .
      dockerfile: aluno-service/Dockerfile
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  treino-service:
    build:
      context: .
      dockerfile: treino-service/Dockerfile
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  financeiro-service:
    build:
      context: .
      dockerfile: financeiro-service/Dockerfile
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      ALUNO_HOST: aluno-service
      TREINO_HOST: treino-service
      FINANCEIRO_HOST: financeiro-service
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - aluno-service
      - treino-service
      - financeiro-service

volumes:
  postgres-data:
    external: true
    name: gymflow-postgres-data
